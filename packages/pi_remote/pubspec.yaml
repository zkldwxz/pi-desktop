name: pi_remote
description: >-
  pi-desktop's remote host: the files, Git, search, Claude Code, terminals and
  language servers of a project on another machine, served by a headless
  program over one SSH connection. No Flutter in the library, so that the
  server compiles with `dart compile exe`.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  pi_agent:
    path: ../pi_agent
  pi_conpty:
    path: ../pi_conpty
  crypto: ^3.0.6
  meta: ^1.15.0
  path: ^1.9.1

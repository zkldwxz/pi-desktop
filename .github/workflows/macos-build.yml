# A macOS build of pi-desktop to try: a .zip and a .dmg per architecture, ad-hoc
# signed (not notarized: open it with right-click → Open the first time).
# Nothing is published; the files are this run's artifacts.
#
#   Actions → macOS build → Run workflow         (pick the architecture)
#   git push to a build/** branch                (both architectures)
#   (workflow_dispatch needs this file on the default branch; until it is
#   merged there, the branch below builds on every push.)
name: macOS build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture (arm64 = Apple Silicon, x64 = Intel)
        type: choice
        options: [both, arm64, x64]
        default: both
  push:
    branches: ['build/**', 'claude/relaxed-clarke-wc7ko2']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.matrix.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        shell: bash
        env:
          ARCH: ${{ inputs.arch || 'both' }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          echo "version=${version%%+*}" >> "$GITHUB_OUTPUT"
          case "$ARCH" in
            arm64) m='[{"arch":"arm64","runner":"macos-15"}]' ;;
            x64)   m='[{"arch":"x64","runner":"macos-15-intel"}]' ;;
            *)     m='[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]' ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  remote:
    name: Remote server builds (published for apps to download)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - id: build
        name: Build the Linux servers (x64, arm64)
        run: |
          dart run tool/build_remote_server.dart --out build/remote
          echo "version=$(cat build/remote/VERSION)" >> "$GITHUB_OUTPUT"
      # The apps carry VERSION and servers.json (a few hundred bytes) and download
      # the build a host needs, from this release, the first time they connect.
      # Named by what was built, so the release is made once and never changed.
      - name: Publish them as a release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          tag="server-$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is published already"
          else
            gh release create "$tag" build/remote/*.gz \
              --title "Remote server $VERSION" \
              --notes "The server pi-desktop puts on an SSH host (downloaded by the app when a project is opened there). Built from $GITHUB_SHA." \
              --prerelease --latest=false --target "$GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: remote-manifest
          if-no-files-found: error
          path: |
            build/remote/VERSION
            build/remote/servers.json

  build:
    name: Build macOS ${{ matrix.arch }}
    needs: [plan, remote]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Resolve dependencies
        run: flutter pub get
      - uses: actions/download-artifact@v7
        with:
          name: remote-manifest
          path: build/remote-manifest
      - name: Build
        run: flutter build macos --release
      - name: Bundle the Pi runtime, sign ad hoc, archive
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          built="build/macos/Build/Products/Release/pi-desktop.app"
          # flutter build makes a universal app (arm64 and x86_64: twice the
          # size); this one is for one architecture only.
          lipo_arch=${{ matrix.arch }}
          [ "$lipo_arch" != x64 ] || lipo_arch=x86_64
          app="$RUNNER_TEMP/thin/pi-desktop.app"
          mkdir -p "$RUNNER_TEMP/thin"
          ditto --arch "$lipo_arch" "$built" "$app"
          # Not the servers themselves: their list, to download from.
          mkdir -p "$app/Contents/Resources/remote"
          cp build/remote-manifest/VERSION build/remote-manifest/servers.json "$app/Contents/Resources/remote/"
          arch=${{ matrix.arch }}
          [ "$arch" != x64 ] || arch=x86_64
          lipo "$app/Contents/MacOS/pi-desktop" -verify_arch "$arch"
          for item in "$app"/Contents/Frameworks/*.framework "$app"/Contents/Frameworks/*.dylib; do
            [ -e "$item" ] || continue
            codesign --force --sign - "$item"
          done
          python3 - "$app/Contents/Resources/pi-runtime" <<'PY'
          import os, subprocess, sys
          magic = {bytes.fromhex(x) for x in ('cffaedfe', 'feedfacf', 'cafebabe', 'cafebabf', 'bebafeca', 'bfbafeca')}
          for root, dirs, files in os.walk(sys.argv[1], followlinks=False):
              for name in files:
                  path = os.path.join(root, name)
                  if os.path.islink(path):
                      continue
                  with open(path, 'rb') as f:
                      if f.read(4) not in magic:
                          continue
                  subprocess.run(['codesign', '--force', '--sign', '-', path], check=True)
          PY
          codesign --force --sign - "$app/Contents/MacOS/pi-desktop-browser-host"
          codesign --force --sign - --entitlements macos/FinderExtension/FinderExtension.entitlements "$app/Contents/PlugIns/FinderExtension.appex"
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/pi-desktop-$VERSION-macos-${{ matrix.arch }}.zip"
          dmg_stage=$(mktemp -d "$RUNNER_TEMP/pi-desktop-dmg.XXXXXX")
          trap 'rm -rf "$dmg_stage"' EXIT
          ditto "$app" "$dmg_stage/pi-desktop.app"
          ln -s /Applications "$dmg_stage/Applications"
          hdiutil create -quiet -format UDZO -volname 'pi-desktop' -srcfolder "$dmg_stage" "dist/pi-desktop-$VERSION-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v6
        with:
          name: pi-desktop-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

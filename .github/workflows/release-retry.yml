# Retry failed pi-desktop build jobs once on a fresh runner.
name: Pi desktop release retry

on:
  workflow_run:
    workflows: [Pi desktop release]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'pi-v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Retry failed builds
        run: |
          failed=$(gh run view "$RUN" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join("\n")')
          echo "Failed: $failed"
          if grep -q '^Build ' <<< "$failed"; then
            gh run rerun "$RUN" --failed
          fi

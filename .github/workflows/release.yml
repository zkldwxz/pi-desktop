# pi-vX.Y.Z tags publish standalone desktop archives to the repository named
# by PI_DESKTOP_RELEASE_REPOSITORY (owner/repository). Manual runs build only.
# For a different destination repository, set PI_DESKTOP_RELEASE_TOKEN to a
# token with contents write access and create the same tag there first.
# Configure the update URL, public key and exact allowed HTTPS origins. GitHub
# release assets redirect; configure every origin in the actual redirect chain.
name: Pi desktop release

on:
  push:
    tags: ['pi-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && format('pi-desktop-{0}', github.ref) || format('pi-desktop-build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Check updater version matches pubspec
        run: |
          flutter pub get
          flutter test test/update/version_test.dart
      - id: version
        name: Validate version and release destination
        env:
          RELEASE_REPOSITORY: ${{ vars.PI_DESKTOP_RELEASE_REPOSITORY }}
          UPDATE_URL: ${{ vars.PI_DESKTOP_UPDATE_URL }}
          UPDATE_PUBLIC_KEY: ${{ vars.PI_DESKTOP_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::Invalid pubspec version: $version"
            exit 1
          fi
          marketing=${version%%+*}
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_NAME" != "pi-v$marketing" ]; then
              echo "::error::Tag must be pi-v$marketing"
              exit 1
            fi
            if ! [[ "$RELEASE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [[ "/$RELEASE_REPOSITORY/" =~ /\.\.?/ ]]; then
              echo '::error::Set PI_DESKTOP_RELEASE_REPOSITORY to owner/repository'
              exit 1
            fi
            if [[ "$UPDATE_URL" != https://* ]]; then
              echo '::error::Set PI_DESKTOP_UPDATE_URL to an HTTPS URL'
              exit 1
            fi
            if [ -z "$UPDATE_PUBLIC_KEY" ]; then
              echo '::error::Set PI_DESKTOP_UPDATE_PUBLIC_KEY'
              exit 1
            fi
          fi
          echo "version=$marketing" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    env:
      PI_DESKTOP_UPDATE_URL: ${{ github.event_name == 'push' && vars.PI_DESKTOP_UPDATE_URL || '' }}
      PI_DESKTOP_UPDATE_PUBLIC_KEY: ${{ github.event_name == 'push' && vars.PI_DESKTOP_UPDATE_PUBLIC_KEY || '' }}
      PI_DESKTOP_UPDATE_ALLOWED_ORIGINS: ${{ github.event_name == 'push' && vars.PI_DESKTOP_UPDATE_ALLOWED_ORIGINS || '' }}
      PI_DESKTOP_DOWNLOAD_URL: ${{ github.event_name == 'push' && vars.PI_DESKTOP_DOWNLOAD_URL || '' }}
      PI_DESKTOP_CHANGELOG_URL: ${{ github.event_name == 'push' && vars.PI_DESKTOP_CHANGELOG_URL || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, arch: arm64, runner: macos-15 }
          - { platform: macos, arch: x64, runner: macos-15-intel }
          - { platform: windows, arch: x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - id: iroh
        uses: ./.github/actions/pi-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            args+=("--dart-define=PI_DESKTOP_UPDATE_URL=$PI_DESKTOP_UPDATE_URL" "--dart-define=PI_DESKTOP_UPDATE_PUBLIC_KEY=$PI_DESKTOP_UPDATE_PUBLIC_KEY" "--dart-define=PI_DESKTOP_UPDATE_ALLOWED_ORIGINS=$PI_DESKTOP_UPDATE_ALLOWED_ORIGINS" "--dart-define=PI_DESKTOP_DOWNLOAD_URL=$PI_DESKTOP_DOWNLOAD_URL" "--dart-define=PI_DESKTOP_CHANGELOG_URL=$PI_DESKTOP_CHANGELOG_URL")
          fi
          flutter build macos --release "${args[@]}"
      - name: Bundle macOS runtime and archive
        if: matrix.platform == 'macos'
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          app="build/macos/Build/Products/Release/pi-desktop.app"
          # The server SSH projects run on their host: built here for Linux (x64,
          # arm64) and this Mac, carried gzipped (lib/remote/remote_binaries.dart).
          dart run tool/build_remote_server.dart --out build/remote
          mkdir -p "$app/Contents/Resources/remote"
          cp build/remote/VERSION build/remote/pi-desktop-server-*.gz "$app/Contents/Resources/remote/"
          dart run tool/bundle_pi_runtime.dart --target "$app/Contents/Resources/pi-runtime" --platform macos --arch ${{ matrix.arch }}
          arch=${{ matrix.arch }}
          [ "$arch" != x64 ] || arch=x86_64
          lipo "$app/Contents/MacOS/pi-desktop" -verify_arch "$arch"
          lipo "$app/Contents/Resources/pi-runtime/node" -verify_arch "$arch"
          for item in "$app"/Contents/Frameworks/*.framework "$app"/Contents/Frameworks/*.dylib; do
            [ -e "$item" ] || continue
            codesign --force --sign - "$item"
          done
          python3 - "$app/Contents/Resources/pi-runtime" <<'PY'
          import os, subprocess, sys
          magic = {bytes.fromhex(x) for x in ('cffaedfe', 'feedfacf', 'cafebabe', 'cafebabf', 'bebafeca', 'bfbafeca')}
          for root, dirs, files in os.walk(sys.argv[1], followlinks=False):
              for name in files:
                  path = os.path.join(root, name)
                  if os.path.islink(path):
                      continue
                  with open(path, 'rb') as f:
                      if f.read(4) not in magic:
                          continue
                  subprocess.run(['codesign', '--force', '--sign', '-', path], check=True)
          PY
          codesign --force --sign - "$app/Contents/MacOS/pi-desktop-browser-host"
          codesign --force --sign - --entitlements macos/FinderExtension/FinderExtension.entitlements "$app/Contents/PlugIns/FinderExtension.appex"
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/pi-runtime/node" --version
          "$app/Contents/Resources/pi-runtime/node" "$app/Contents/Resources/pi-runtime/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js" --version
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/pi-desktop-$VERSION-macos-${{ matrix.arch }}.zip"
          dmg_stage=$(mktemp -d "$RUNNER_TEMP/pi-desktop-dmg.XXXXXX")
          trap 'rm -rf "$dmg_stage"' EXIT
          ditto "$app" "$dmg_stage/pi-desktop.app"
          ln -s /Applications "$dmg_stage/Applications"
          hdiutil create -quiet -format UDZO -volname 'pi-desktop' -srcfolder "$dmg_stage" "dist/pi-desktop-$VERSION-macos-${{ matrix.arch }}.dmg"
      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $buildArgs = @()
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $buildArgs += "--dart-define=PI_DESKTOP_UPDATE_URL=$env:PI_DESKTOP_UPDATE_URL"
            $buildArgs += "--dart-define=PI_DESKTOP_UPDATE_PUBLIC_KEY=$env:PI_DESKTOP_UPDATE_PUBLIC_KEY"
            $buildArgs += "--dart-define=PI_DESKTOP_UPDATE_ALLOWED_ORIGINS=$env:PI_DESKTOP_UPDATE_ALLOWED_ORIGINS"
            $buildArgs += "--dart-define=PI_DESKTOP_DOWNLOAD_URL=$env:PI_DESKTOP_DOWNLOAD_URL"
            $buildArgs += "--dart-define=PI_DESKTOP_CHANGELOG_URL=$env:PI_DESKTOP_CHANGELOG_URL"
          }
          flutter build windows --release @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle Windows runtime and build installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          dart run tool/build_windows.dart --skip-build --arch ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = "build/windows/${{ matrix.arch }}/runner/Release/data/pi-runtime"
          & "$runtime/node.exe" "$runtime/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/installers/pi-desktop-$env:VERSION-setup.exe" dist/
      - uses: actions/upload-artifact@v6
        with:
          name: pi-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish pi-desktop release
    if: github.event_name == 'push'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.PI_DESKTOP_RELEASE_TOKEN || github.token }}
      GH_REPO: ${{ vars.PI_DESKTOP_RELEASE_REPOSITORY }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Resolve dependencies
        run: flutter pub get
      - uses: actions/download-artifact@v7
        with:
          pattern: pi-desktop-*
          path: dist
          merge-multiple: true
      - name: Sign update manifest
        shell: bash
        env:
          SIGNING_SEED: ${{ secrets.PI_DESKTOP_UPDATE_SIGNING_KEY }}
          PI_DESKTOP_RELEASE_REPOSITORY: ${{ vars.PI_DESKTOP_RELEASE_REPOSITORY }}
          PI_DESKTOP_UPDATE_URL: ${{ vars.PI_DESKTOP_UPDATE_URL }}
          PI_DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.PI_DESKTOP_UPDATE_PUBLIC_KEY }}
          PI_DESKTOP_UPDATE_ALLOWED_ORIGINS: ${{ vars.PI_DESKTOP_UPDATE_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_SEED" ]; then
            echo '::error::Set PI_DESKTOP_UPDATE_SIGNING_KEY to the base64 private seed'
            exit 1
          fi
          key_file=$(mktemp "$RUNNER_TEMP/pi-update-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$SIGNING_SEED" > "$key_file"
          unset SIGNING_SEED
          export PI_DESKTOP_UPDATE_SIGNING_KEY="$key_file"
          dart run tool/release_manifest.dart \
            --windows "dist/pi-desktop-$VERSION-setup.exe" \
            --macos-arm64 "dist/pi-desktop-$VERSION-macos-arm64.zip" \
            --macos-x64 "dist/pi-desktop-$VERSION-macos-x64.zip" \
            --manifest dist/latest.json
      - name: Publish archives and manifest
        shell: bash
        run: |
          set -euo pipefail
          # Never let gh create a missing tag on the destination's default branch.
          gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" > /dev/null
          destination_sha=$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$destination_sha" != "$GITHUB_SHA" ]; then
            echo '::error::Destination tag does not point to the commit built by this run'
            exit 1
          fi
          archives=("dist/pi-desktop-$VERSION-macos-arm64.zip" "dist/pi-desktop-$VERSION-macos-x64.zip" "dist/pi-desktop-$VERSION-macos-arm64.dmg" "dist/pi-desktop-$VERSION-macos-x64.dmg" "dist/pi-desktop-$VERSION-setup.exe")
          # A published version must remain immutable: replacing its assets can
          # invalidate a manifest clients have already downloaded.
          if gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo '::error::Release already exists; publish a new version or resolve the incomplete draft manually'
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${archives[@]}" dist/latest.json \
            --verify-tag --draft --title "pi-desktop $VERSION" --notes-file "release-notes/$VERSION.en.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false

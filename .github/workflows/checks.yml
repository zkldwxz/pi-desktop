# Keeps the code analyzable and its tests passing.
#
#   A pull request, a push to main   flutter analyze (infos too), and the
#                                    Dart files changed formatted
#   Actions → Checks → Run workflow   focused desktop tests and real Dart LSP
#
# The Linux runner runs tests only; release builds target macOS and Windows.
name: Checks

on:
  pull_request:
    paths-ignore: &docs
      - '**.md'
      - docs/**
      - release-notes/**
      - site/**
      - site-worker/**
  push:
    branches: [main]
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

# A pull request's run gives way to its next push.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  pi-runtime:
    name: Pi runtime and adapter
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/pi/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev clang ninja-build
      - run: npm ci --prefix runtime/pi --ignore-scripts
      - run: npm test --prefix runtime/pi
      - run: flutter pub get
      - run: flutter test test/kernel/pi_kernel_test.dart test/kernel/pi_integration_test.dart

  analyze:
    name: Analyze
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      # The files changed alone: many older ones are not formatted yet.
      - name: Format the Dart files changed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.dart')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Dart file changed"
            exit 0
          fi
          if ! dart format --output=none --set-exit-if-changed "${files[@]}"; then
            echo "::error::Not formatted: run dart format on the files above"
            exit 1
          fi

  focused-tests:
    name: Focused desktop tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/pi/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev clang ninja-build
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - run: flutter pub get
      - run: npm ci --prefix runtime/pi --ignore-scripts
      - name: Pi, updater, platform and LSP tests
        run: >-
          flutter test test/kernel/pi_kernel_test.dart test/kernel/pi_integration_test.dart
          test/kernel/pi_remote_test.dart test/kernel/pi_runtime_updates_test.dart
          test/update test/platform test/ide/lsp/core test/ide/lsp/install
          test/ide/lsp/packs test/ide/lsp/catalog
          test/settings/models_page_test.dart test/settings/general_context_menu_test.dart
          test/remote/ssh_server_form_test.dart
      - name: Real Dart language server
        run: flutter test --run-skipped -t lsp-smoke test/ide/lsp/smoke/dart_language_server_smoke_test.dart

name: upstream-sync

# Weekly: tries to merge the upstream (baocode-dev/baocode). A clean merge
# becomes a pull request; conflicts become an issue naming the files.
# See docs/upstream-sync.md.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the upstream
        id: merge
        run: |
          set -uo pipefail
          git config user.name  "upstream-sync"
          git config user.email "upstream-sync@users.noreply.github.com"
          git remote add upstream https://github.com/baocode-dev/baocode.git
          git fetch --no-tags upstream main
          base=$(git merge-base HEAD upstream/main || true)
          if [ -z "$base" ]; then echo "state=nobase" >> "$GITHUB_OUTPUT"; exit 0; fi
          count=$(git rev-list --count "$base..upstream/main")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then echo "state=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          branch="sync/upstream-$(date +%Y%m%d)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git merge --no-ff -m "chore: merge upstream $(git rev-parse --short upstream/main) ($count commits)" upstream/main; then
            git checkout -b "$branch"
            git push -u origin "$branch"
            echo "state=clean" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi
      - name: Open a pull request
        if: steps.merge.outputs.state == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "chore: merge upstream (${{ steps.merge.outputs.count }} commits)" \
            --body "A clean merge of baocode-dev/baocode. Before merging: run \`tool/upstream_sync.sh --check\` (branding, analysis, tests of the folders touched). See docs/upstream-sync.md."
      - name: Report the conflicts
        if: steps.merge.outputs.state == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The upstream is ${{ steps.merge.outputs.count }} commit(s) ahead, and a merge conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' conflicts.txt
            echo
            echo "Run \`tool/upstream_sync.sh\` locally and settle them as docs/upstream-sync.md says."
          } > body.md
          gh issue create --title "Upstream sync: conflicts in $(wc -l < conflicts.txt) file(s)" --body-file body.md

name: upstream-sync

# Weekly: tries to merge the upstream (baocode-dev/baocode), rebranded by
# tool/rebrand.py. A clean merge becomes a pull request; conflicts become an
# issue naming the files.
# See docs/upstream-sync.md.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the upstream
        id: merge
        run: |
          set -uo pipefail
          git config user.name  "upstream-sync"
          git config user.email "upstream-sync@users.noreply.github.com"
          tool/upstream_sync.sh > sync.log 2>&1
          code=$?
          cat sync.log
          branch=$(git rev-parse --abbrev-ref HEAD)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list --count HEAD..upstream-rebranded 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          # The rebranded snapshots are kept on a branch of ours.
          git push -f origin upstream-rebranded || true
          if [ $code -eq 0 ] && [ "$branch" != "${{ github.event.repository.default_branch }}" ]; then
            git push -u origin "$branch"
            echo "state=clean" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 2 ]; then
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          else
            echo "state=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Open a pull request
        if: steps.merge.outputs.state == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "chore: merge upstream (${{ steps.merge.outputs.count }} commits)" \
            --body "A clean merge of baocode-dev/baocode. Before merging: run \`tool/upstream_sync.sh --check\` (branding, analysis, tests of the folders touched). See docs/upstream-sync.md."
      - name: Report the conflicts
        if: steps.merge.outputs.state == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The upstream is ${{ steps.merge.outputs.count }} commit(s) ahead, and a merge conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' conflicts.txt
            echo
            echo "Run \`tool/upstream_sync.sh\` locally (it picks up the \`upstream-rebranded\` branch this run pushed) and settle them as docs/upstream-sync.md says."
          } > body.md
          gh issue create --title "Upstream sync: conflicts in $(wc -l < conflicts.txt) file(s)" --body-file body.md

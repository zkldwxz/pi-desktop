name: PI desktop browser extension

on:
  push:
    tags: ['pi-extension-v*']
  pull_request:
    paths:
      - 'browser_extension/**'
      - 'tool/pack_browser_extension.sh'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check extension identity and version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node --check browser_extension/background.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const manifest = JSON.parse(fs.readFileSync('browser_extension/manifest.json', 'utf8'));
          const id = crypto.createHash('sha256').update(Buffer.from(manifest.key, 'base64')).digest('hex')
            .slice(0, 32).replace(/[0-9a-f]/g, x => String.fromCharCode(97 + parseInt(x, 16)));
          if (id !== 'lhdkmdjhjipndmialanjbblnmfhkehpc') throw new Error('Unexpected extension identity');
          if (process.env.REF_TYPE === 'tag' && process.env.REF_NAME !== `pi-extension-v${manifest.version}`)
            throw new Error('Tag must match the extension version');
          JS
      - name: Pack independent extension
        run: bash tool/pack_browser_extension.sh
      - uses: actions/upload-artifact@v6
        with:
          name: pi-desktop-browser-extension
          path: build/browser_extension/pi-desktop-browser-*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/pi-extension-v')
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: pi-desktop-browser-extension
          path: dist
      - name: Publish to this fork's GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes
